<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">
  <title>Mira, entrenador de puntería</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Unbounded:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="wrap bar">
      <div class="brandrow">
        <div class="brand">mira</div>
        <nav class="tabs" role="tablist" aria-label="Secciones">
          <button class="tab" role="tab" id="tab-train" data-view="train" aria-selected="true" aria-controls="view-train" type="button">Entrenar</button>
          <button class="tab" role="tab" id="tab-cal" data-view="cal" aria-selected="false" aria-controls="view-cal" tabindex="-1" type="button">Calendario</button>
          <button class="tab" role="tab" id="tab-charts" data-view="charts" aria-selected="false" aria-controls="view-charts" tabindex="-1" type="button">Gráficas</button>
        </nav>
      </div>

      <div class="settings-toggle">
        <button class="icon-btn" id="open-settings" type="button" aria-label="Abrrir personalización" aria-expanded="false" title="Personalización">⚙</button>
      </div>

      <div class="profile" id="profile-chip">
        <span class="lvl" id="p-lvl">Nv. 1</span>
        <span class="who">
          <span class="rk" id="p-rank"><span class="rank-icon bronce">B</span>Bronce · <b>0</b></span>
          <span class="xpbar"><i id="p-xpbar"></i></span>
        </span>
      </div>
    </div>

    <div class="settings-panel" id="settings-panel" hidden>
      <h2>Personalización</h2>

      <div class="group" role="group" aria-labelledby="l-theme">
        <span class="group-label" id="l-theme">Tema</span>
        <button class="chip" data-k="theme" data-v="pink" type="button"><span class="theme-swatch"><i></i></span> Rosa</button>
        <button class="chip" data-k="theme" data-v="cyan" type="button"><span class="theme-swatch"><i></i></span> Cian</button>
        <button class="chip" data-k="theme" data-v="purple" type="button"><span class="theme-swatch"><i></i></span> Morado</button>
        <button class="chip" data-k="theme" data-v="lime" type="button"><span class="theme-swatch"><i></i></span> Lima</button>
        <button class="chip" data-k="theme" data-v="amber" type="button"><span class="theme-swatch"><i></i></span> Ámbar</button>
      </div>

      <div class="group" role="group" aria-labelledby="l-cursor">
        <span class="group-label" id="l-cursor">Puntero</span>
        <button class="chip" data-k="cursor" data-v="crosshair" type="button">✣ Preciso</button>
        <button class="chip" data-k="cursor" data-v="dot" type="button">● Punto</button>
        <button class="chip" data-k="cursor" data-v="ring" type="button">◎ Anillo</button>
        <button class="chip" data-k="cursor" data-v="plus" type="button">＋ Cruz</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="view" id="view-train" role="tabpanel" aria-labelledby="tab-train">
      <div class="settings" id="settings">
        <div class="group" role="group" aria-labelledby="l-mode">
          <span class="group-label" id="l-mode">Modo</span>
          <button class="chip" data-k="mode" data-v="classic" title="Un objetivo cada vez" type="button">Clásico</button>
          <button class="chip" data-k="mode" data-v="burst" title="Tres objetivos a la vez" type="button">Ráfaga</button>
          <button class="chip" data-k="mode" data-v="ranked" title="Compite contra un bot de tu nivel" type="button">Ranked</button>
        </div>

        <div class="group" role="group" aria-labelledby="l-size">
          <span class="group-label" id="l-size">Tamaño</span>
          <button class="chip" data-k="size" data-v="s" type="button">Pequeño</button>
          <button class="chip" data-k="size" data-v="m" type="button">Medio</button>
          <button class="chip" data-k="size" data-v="l" type="button">Grande</button>
        </div>

        <div class="group" role="group" aria-labelledby="l-dur">
          <span class="group-label" id="l-dur">Duración</span>
          <button class="chip" data-k="dur" data-v="30" type="button">30 s</button>
          <button class="chip" data-k="dur" data-v="60" type="button">60 s</button>
        </div>
      </div>

      <p class="ranked-note" id="ranked-note" hidden></p>
      <div class="ranked-ladder" id="ranked-ladder" hidden></div>

      <div class="hud">
        <div><span class="num" id="h-score">0</span><span class="cap">puntos</span></div>
        <div class="bot" id="h-bot-wrap" hidden><span class="num" id="h-bot">0</span><span class="cap">bot</span></div>
        <div><span class="num" id="h-time">30.0</span><span class="cap">segundos</span></div>
        <div><span class="num" id="h-acc">–</span><span class="cap">precisión</span></div>
      </div>

      <div class="arena">
        <canvas id="arena" role="img" aria-label="Zona de entrenamiento: haz clic en los objetivos rosas"></canvas>
        <button class="ov-idle" id="ov-idle" type="button">
          <span class="idle-title" id="idle-title">Haz clic para empezar</span>
          <span class="idle-sub" id="idle-sub"></span>
        </button>
        <div class="ov-res" id="ov-res" hidden></div>
      </div>

      <p class="today" id="today"></p>
    </section>

    <section class="view" id="view-cal" role="tabpanel" aria-labelledby="tab-cal" hidden>
      <div class="cal-layout">
        <div>
          <div class="cal-head">
            <h2 class="cal-title" id="cal-title"></h2>
            <div class="cal-nav">
              <button class="icon-btn" id="cal-prev" type="button" aria-label="Mes anterior">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
              </button>
              <button class="chip" id="cal-today" type="button">Hoy</button>
              <button class="icon-btn" id="cal-next" type="button" aria-label="Mes siguiente">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
              </button>
            </div>
          </div>

          <div class="dow" aria-hidden="true">
            <span>lun</span><span>mar</span><span>mié</span><span>jue</span><span>vie</span><span>sáb</span><span>dom</span>
          </div>
          <div class="days" id="cal-days" role="group" aria-label="Días del mes"></div>
          <div class="legend" aria-hidden="true">
            <span>menos</span>
            <i class="lg" data-l="0"></i><i class="lg" data-l="1"></i><i class="lg" data-l="2"></i><i class="lg" data-l="3"></i><i class="lg" data-l="4"></i>
            <span>más sesiones</span>
          </div>
        </div>

        <aside class="detail" id="cal-detail" aria-live="polite"></aside>
      </div>
    </section>

    <section class="view" id="view-charts" role="tabpanel" aria-labelledby="tab-charts" hidden>
      <div class="chart-controls">
        <div class="group" role="group" aria-labelledby="l-metric">
          <span class="group-label" id="l-metric">Mostrar</span>
          <button class="chip" data-k="metric" data-v="score" type="button">Puntos</button>
          <button class="chip" data-k="metric" data-v="acc" type="button">Precisión</button>
          <button class="chip" data-k="metric" data-v="rt" type="button">Reacción</button>
          <button class="chip" data-k="metric" data-v="hits" type="button">Objetivos</button>
          <button class="chip" data-k="metric" data-v="rating" type="button">Ranked</button>
        </div>

        <div class="group" role="group" aria-labelledby="l-range">
          <span class="group-label" id="l-range">Periodo</span>
          <button class="chip" data-k="range" data-v="7" type="button">7 días</button>
          <button class="chip" data-k="range" data-v="14" type="button">14 días</button>
          <button class="chip" data-k="range" data-v="30" type="button">30 días</button>
        </div>
      </div>

      <div class="chart-summary">
        <div class="big" id="ch-big"></div>
        <p id="ch-caption"></p>
      </div>

      <div class="chart" id="chart" tabindex="0" role="group">
        <div id="chart-svg"></div>
        <div class="tip" id="tip" hidden></div>
        <div class="chart-empty" id="chart-empty" hidden>
          <p id="chart-empty-txt">No hay sesiones en este periodo.<br>Entrena una para ver tu evolución día a día.</p>
          <button class="btn primary" id="empty-go" type="button">Entrenar ahora</button>
        </div>
      </div>
      <div class="sr" id="chart-sr" aria-live="polite"></div>
    </section>
  </main>

  <footer class="foot">
    <div class="wrap">
      <p>Tus sesiones se guardan solo en este navegador.</p>
      <div class="links">
        <button class="linkbtn" id="btn-export" type="button">Exportar datos</button>
        <button class="linkbtn" id="btn-import" type="button">Importar datos</button>
        <button class="linkbtn" id="btn-sample" type="button">Cargar datos de ejemplo</button>
        <button class="linkbtn" id="btn-clear" type="button">Borrar historial</button>
        <input type="file" id="import-file" accept="application/json,.json" hidden>
        <p class="io-status" id="io-status" aria-live="polite"></p>
      </div>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
